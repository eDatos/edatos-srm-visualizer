<table mat-table [dataSource]='dataSource' multiTemplateDataRows class='mat-elevation-z6'>
    <ng-container matColumnDef='{{column.name}}' *ngFor='let column of columnsToDisplay'>
        <th mat-header-cell *matHeaderCellDef sticky> {{column.name}}
            <div *ngIf='isAdvancedSearch'>
                <input (keyup.enter)="applyFilters(column.value, $event.target)"/>
            </div>
        </th>
        <td mat-cell *matCellDef='let data'> {{data[column.value]}} </td>
        <td mat-cell class='empty-td' *matNoDataRow [attr.colspan]='columnsToDisplay.length'>
            <div class='empty-td-container'>
                <span class='text-no-result'>{{ 'noResourceResults' | translate }}</span>
                <span class='text-retry'>{{ 'retrySearch' | translate }}</span>
            </div>
        </td>
    </ng-container>
    <ng-container matColumnDef='expand'>
        <th mat-header-cell *matHeaderCellDef aria-label='row actions' sticky>&nbsp;</th>
        <td mat-cell *matCellDef='let data'>
            <button *ngIf='isRowExpanded(data)' class='element-actions'
                    (click)='collapseRow(data); $event.stopPropagation()'>
                <i class='fa-solid fa-circle-x'></i>
            </button>
        </td>
    </ng-container>

    <ng-container matColumnDef='expandedDetail'>
        <td mat-cell class='element-td' *matCellDef='let data' [attr.colspan]='columnsToDisplayWithExpand.length'>
            <div class='element-detail'
                 [@detailExpand]="isRowExpanded(data) ? 'expanded' : 'collapsed'">
                <div class='element-description'>
                    <label class='element-label'>{{ 'resourceParameters.description' | translate }}</label>
                    <p class='element-description-attribution' [innerHTML]='data.description'></p>
                </div>
                <div class='element-link'>
                    <div>
                        <label class='element-label'>{{ 'resourceParameters.selfLink' | translate }}</label>
                        <div class='element-link-attribution'>
                            <code>{{data.selfLink}}</code>
                            <button type='button' class='element-link-actions'>
                                <i class='fa-thin fa-arrow-up-right-from-square'></i>
                            </button>
                            <button class='element-link-actions'>
                                <i class='fa-thin fa-copy'></i>
                            </button>
                        </div>
                    </div>
                    <div class='element-detail-button'>
                        <button type='button' class='text-icon-button' [routerLink]='[routerLink]'>
                            <i class='fa-thin fa-eye'></i>&nbsp;
                            <span>{{ 'seeResource' | translate | uppercase }}</span>
                        </button>
                    </div>
                </div>
            </div>
        </td>
    </ng-container>


    <tr mat-header-row *matHeaderRowDef='columnsToDisplayWithExpand; sticky:true' class='element-header'></tr>
    <tr mat-row *matRowDef='let data; columns: columnsToDisplayWithExpand;'
        class='element-row'
        [class.expanded-row]='isRowExpanded(data)'
        (click)='toggleRow(data)'>
    </tr>
    <tr mat-row *matRowDef="let row; columns: ['expandedDetail']" class='detail-row'></tr>
</table>
