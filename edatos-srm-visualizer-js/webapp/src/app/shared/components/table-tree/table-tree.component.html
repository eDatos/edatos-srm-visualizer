<table mat-table [dataSource]="dataSource" class="mat-elevation-z8">
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef style='display: none'>
        <span [style.paddingLeft.px]="40"> Name </span>
      </th>
      <td mat-cell *matCellDef="let data" (click)="onClickResource(data.urn)"> 
        <button mat-icon-button 
                [style.visibility]="!data.expandable ? 'hidden' : ''"
                [style.marginLeft.px]="data.level * 32"
                (click)="treeControl.toggle(data)">
          <mat-icon class="mat-icon-rtl-mirror">
            chevron_right
          </mat-icon>
        </button>
          <strong>{{data.id}}</strong> {{data.name}}
      </td>
    </ng-container> 
  
    <ng-container matColumnDef="id">
      <th mat-header-cell *matHeaderCellDef style='display: none'> ID </th>
      <td mat-cell *matCellDef="let data">{{data.id}} </td>
    </ng-container> 
  
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
