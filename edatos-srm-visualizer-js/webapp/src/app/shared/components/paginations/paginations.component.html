<div class="pagination">
    <ul *ngIf="pages.length > 1">
        <li [class.disabled]="currentPage === 0">
            <a class="page-link" href="javascript:void(0)" (click)="onPreviusPage()" role="button">
                <i class="fa-thin fa-chevrons-left"></i>
            </a>
        </li>

        <li *ngFor="let page of pages" [class.active]="page === currentPage">
            <a class="page-link" href="javascript:void(0)" (click)="onChangePage(page)" role="button">
                {{ page + 1 }}
            </a>
        </li>

        <li [class.disabled]="currentPage === pages.length - 1">
            <a class="page-link" href="javascript:void(0)" (click)="onNextPage()" role="button">
                <i class="fa-thin fa-chevrons-right"></i>
            </a>
        </li>
    </ul>
</div>
