
<div class='general-buttons row'>
    <div class='col'>
        <button (click)='onReturn()' class="text-icon-button">
            <i class="fa-thin fa-left"></i>&nbsp;
            <span>{{ 'back' | translate | uppercase }}</span>
        </button>
    </div>
    <div >
        <p-dropdown #select [options]='versions' [filter]='true'  optionLabel="name" optionValue="value"
                    filterBy='value' placeholder="{{ 'otherVersions' | translate | uppercase }}"
                    class='p-dropdown-custom' dropdownIcon='fa-thin fa-chevron-down' (onChange)="onLoadDetailVersion($event)"
                    (onShow)="handleOnPanelShow()" (onHide)="handleOnPanelHide()" filterPlaceholder="{{ 'search' | translate | lowercase }}..." emptyFilterMessage=" ">
            <ng-template let-version pTemplate='item'>
                <div class="country-item">
                    <div>v{{ version.value }}</div>
                </div>
                <!--div class='flex align-items-center gap-2'>
                    <button (click)='onLoadDetailVersion(version.value)'>v{{ version.value }}</button>
                </div-->
            </ng-template>
        </p-dropdown>
    </div>
    <div>
        <!---p-dropdown #download [options]='fileFormats'  optionLabel="name" optionValue="value"
                     placeholder="{{ 'download.title' | translate | uppercase }}"
                    class='p-dropdown-custom' dropdownIcon='fa-thin fa-chevron-down' (onChange)="onDownloadFileFormat($event)"
                    (onShow)="handleOnPanelShow()" (onHide)="handleOnPanelHide()">
            <ng-template let-format pTemplate='item'--->
                <!--div class="country-item">
                    <div>{{ format.name }}</div>
                </div-->
                <!---div class="">
                    <button (click)='onLoadDetailVersion(format.value)' >
                    <i class="fa-thin {{ format.icon }}"></i>&nbsp;
                     <span>{{ format.name }}</span>
                    </button>
                </div>
            </ng-template>
        </p-dropdown--->
        <p-menu [model]="items" #menu [popup]="true" styleClass="kk" class="p-menu-custom" (onShow)="handleVisibilityMenu()" (onHide)="handleVisibilityMenu()"></p-menu>
        <button (click)="menu.toggle($event)"  [ngClass]="expandedMenu ? 'menu-text-icon-button' : 'text-icon-button'">
            <span>{{ 'download.title' | translate | uppercase }}</span>&nbsp;
            <i [ngClass]="expandedMenu ? 'fa-solid fa-chevron-up' : 'fa-thin fa-chevron-down'"></i>
        </button>
    </div>
</div>

<div [formGroup]='detailForm' class="detail-info">
    <label for='id' class='title'>{{ 'codelists.parameters.id' | translate }}</label>
    <input type='text' class='info-id' formControlName='id' id='id' readonly>

    <label for='name' class='title'>{{ 'resourceParameters.name' | translate }}</label>
    <input type='text' formControlName='name' id='name' readonly>

    <label for='version' class='title'>{{ 'resourceParameters.version' | translate }}</label>
    <input type='text' formControlName='version' id='version' readonly>

    <label for='lastUpdateDate' class='title'>{{ 'codelists.parameters.publicationDate' | translate }}</label>
    <input type='text' formControlName='lastUpdateDate' id='lastUpdateDate' readonly>

    <label for='description' class='title'>{{ 'resourceParameters.description' | translate }}</label>
    <div  id='description' [innerHTML]='parseDesriptionToHtml()'></div>

    <label for='uri' class='title'>{{ 'resourceParameters.selfLink' | translate }}</label>
    <div class='info-link'>
        <input type='text' formControlName='uri' id='uri' readonly>
        <div class="element-link-actions">
        <button type="button" >
            <i class="fa-thin fa-arrow-up-right-from-square"></i>
        </button>
        <button  >
            <i class="fa-thin fa-copy"></i>
        </button>
    </div>
    </div>
    

    <label for='urn' class='title'>{{ 'resourceParameters.urn' | translate }}</label>
    <input type='text' formControlName='urn' id='urn' readonly>

    <label for='isRecommended' class='title'>{{ 'codelists.parameters.isRecommended' | translate }}</label>
    <input type='text' formControlName='isRecommended' id='isRecommended' readonly>

    <label for='annotations' class='title'>{{ 'resourceParameters.comments' | translate }}</label>
    <input type='text' formControlName='annotations' id='annotations' readonly>

    <label for='agency' class='title'>{{ 'codelists.parameters.agency' | translate }}</label>
    <input type='text' class='form-control' formControlName='agency' id='agency' readonly>
</div>

    <br>
    <div class='container'>
        <div class='section-tab'>
            <p-tabMenu [model]='navLinks' [activeItem]='activeLink'
                       (activeItemChange)='onActiveItemChange($event)'></p-tabMenu>
        </div>
        <div class='m-30' *ngIf='!dataChildrenLoaded'>
            <mat-progress-bar mode='indeterminate'></mat-progress-bar>
        </div>
        <div class='m-30' *ngIf='activeLink == navLinks[0]'>
            <div class='search-results' [style.display]="dataChildrenLoaded ? 'block' : 'none'">
                <app-table-tree #tabletreenode [data]='dataChildren'
                                (clickEvent)='onLoadDetail($event)'></app-table-tree>
            </div>
        </div>
        <div class='m-30' *ngIf='activeLink == navLinks[1]'>
            <p-table [value]='relatedCodelists' class='search-results'>
                <ng-template pTemplate='header'>
                    <tr>
                        <th>{{ 'resourceParameters.identifier' | translate }}</th>
                        <th>{{ 'resourceParameters.name' | translate }}</th>
                        <th>{{ 'resourceParameters.description' | translate }}</th>
                    </tr>
                </ng-template>
                <ng-template pTemplate='body' let-codelist>
                    <tr>
                        <td>{{ codelist.id }}</td>
                        <td>{{ codelist.name }}</td>
                        <td>{{ codelist.description }}</td>
                    </tr>
                </ng-template>
            </p-table>
        </div>
        <div class='m-30' *ngIf='dataChildren === null'>
            <span>{{ 'resultsNotFound' | translate }}</span>
        </div>
    </div>
    <br />
