<div class="m-30">
    <mat-card mat-elevation-z15> 
        <mat-card-header>
            <mat-card-title>CLASIFICACIONES</mat-card-title>
        </mat-card-header>
    </mat-card>
</div>

<div class="m-30">
    <mat-card mat-elevation-z15>
        <mat-card-header>
            <mat-card-title>DETALLES CLASIFICACIÓN</mat-card-title>
        </mat-card-header>
        <mat-action-row class="m-30" *ngIf="apiSDMX">
            <button mat-raised-button color="primary" (click)="onDownloadSdmx()"  class="ml">
                <mat-icon>download</mat-icon> Descargar SDMX-XML
            </button>
        </mat-action-row>
        <mat-card-content>
            <div [formGroup]="detailForm" class="container">
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>ID</mat-label>
                    <input formControlName="id" matInput placeholder="Placeholder">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>VERSION</mat-label>
                    <input formControlName="version" matInput placeholder="Placeholder">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>NOMBRE</mat-label>
                    <input formControlName="name" matInput placeholder="Placeholder">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>URN</mat-label>
                    <input formControlName="urn" matInput placeholder="Placeholder">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>DESCRIPCIÓN</mat-label>
                    <input formControlName="description" matInput placeholder="Placeholder">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>MANTENEDOR</mat-label>
                    <input formControlName="agency" matInput placeholder="Placeholder">
                </mat-form-field>
                <mat-form-field appearance="outline" class="mlr input">
                    <mat-label>COMENTARIOS</mat-label>
                    <input formControlName="comments" matInput placeholder="Placeholder">
                </mat-form-field>
            </div>
        </mat-card-content>
    </mat-card>
</div>
