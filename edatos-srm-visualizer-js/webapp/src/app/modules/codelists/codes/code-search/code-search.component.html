<div [formGroup]='searchSimpleForm'>
    <div class='general-search row'>
        <div *ngIf='!markedSearchAdvanced'>
            <label for='filter' class='title'>{{ 'resourceParameters.generalSearch' | translate }}</label>
        </div>
        <div class='col' *ngIf='!markedSearchAdvanced'>
            <input type='text' class='form-control' formControlName='filter' id='filter'
                   placeholder="{{ 'search' | translate | lowercase }}..." (keyup.enter)='onSearch()'>
        </div>
        <div *ngIf='markedSearchAdvanced'>
            <p-multiSelect #multiSelect [options]='fields' formControlName='selectedFields'
                           defaultLabel="{{ 'resourceParameters.displayedFields' | translate | uppercase }}"
                           optionLabel='name' [filter]='false' [showToggleAll]='false'
                           [showHeader]='false' class='multiselect-custom-search'
                           [maxSelectedLabels]='0'
                           selectedItemsLabel="{{ 'resourceParameters.displayedFields' | translate | uppercase }}"
                           dropdownIcon='fa-thin fa-chevron-down'
                           (onChange)='onSelectFields($event)'
                           (onPanelShow)='handleOnPanelShow()' (onPanelHide)='handleOnPanelHide()'>
            </p-multiSelect>
        </div>
        <div class='filter-dropdown col' *ngIf='markedSearchAdvanced'>
            <button type='button' (click)='filterOverlay.toggle($event)' [ngClass]="filterOverlay.overlayVisible ? 'menu-text-icon-button' : 'text-icon-button'">
                {{ 'resourceParameters.filters' | translate | uppercase }}
                <i [ngClass]="filterOverlay.overlayVisible ? 'fa-solid fa-chevron-up' : 'fa-thin fa-chevron-down'"></i>
            </button>
            <p-overlayPanel #filterOverlay>
                <span class='filter-section-title'>{{ 'resourceParameters.versions' | translate }}</span>
                <div class='filter-option'>
                    <input type='radio' name='versions' id='allVersions'
                           [checked]='showAllVersions'
                           (change)='onSearchWithAllVersions({checked: true})'>
                    <label for='allVersions'>{{ 'resourceParameters.all' | translate }}</label>
                </div>
                <div class='filter-option'>
                    <input type='radio' name='versions' id='latestVersions'
                           [checked]='!showAllVersions'
                           (change)='onSearchWithAllVersions({checked: false})'>
                    <label for='latestVersions'>{{ 'resourceParameters.latestVersions' | translate }}</label>
                </div>
            </p-overlayPanel>
        </div>
        <div class='custom-control custom-switch'>
            <p-inputSwitch id='advancedSearch' inputId='advancedSearch'
                           (onChange)='toggleVisibility($event)'></p-inputSwitch>
            <label for='advancedSearch'
                   [ngClass]="markedSearchAdvanced?'label-inputswitch-checked':''">{{ 'resourceParameters.advancedSearch' | translate }}</label>
        </div>
    </div>
</div>

<div class='search-results-container'>
    <div #searchResults class='search-results-table' [scrollWindow]='false' infinite-scroll
         [fromRoot]='true'>
        <table-expandable-rows #tableExpandable [columns]='selectedFields'
                               [data]='dataChildren' [routerLinkDetail]='routerLinkDetail'
                               (clickEvent)='onLoadCodeDetail($event)' [advancedSearch]='markedSearchAdvanced'
                               (keyupEvent)='onAdvancedSearch($event)' (sortColumnEvent)="onSortColumn($event)"
                               (selectEvent)="onFilterByValue($event)">
        </table-expandable-rows>
    </div>
</div>
<app-paginations
        [totalItems]="searchConfig.resultSize"
        [pageSize]="searchConfig.resultLimit"
        [currentPage]="searchConfig.currentPage"
        (changePage)="onChangePage($event)">
</app-paginations>
