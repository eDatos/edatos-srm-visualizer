
<div class='general-buttons row'>
    <div class='col'>
        <button (click)='onReturn()' class="text-icon-button">
            <i class="fa-thin fa-left"></i>&nbsp;
            <span>{{ 'back' | translate | uppercase }}</span>
        </button>
    </div>
    <div>
        <p-menu [model]="items" #menu [popup]="true" class="p-menu-custom" (onShow)="handleVisibilityMenu()" (onHide)="handleVisibilityMenu()"></p-menu>
        <button (click)="menu.toggle($event)"  [ngClass]="expandedMenu ? 'menu-text-icon-button' : 'text-icon-button'">
            <span>{{ 'download.title' | translate | uppercase }}</span>&nbsp;
            <i [ngClass]="expandedMenu ? 'fa-solid fa-chevron-up' : 'fa-thin fa-chevron-down'"></i>
        </button>
    </div>
</div>

<div [formGroup]='detailForm' class='detail-info'>
    <label for='id' class='title'>{{ 'codelists.parameters.idCode' | translate }}</label>
    <span class='info-id' id='id'>{{ dataDetail.id }}</span>

    <label for='name' class='title'>{{ 'resourceParameters.name' | translate }}</label>
    <span id='name'>{{ dataDetail.name }}</span>

    <label for='lastUpdatedDate' class='title'>{{ 'codelists.parameters.lastUpdatedDate' | translate }}</label>
    <span id='lastUpdatedDate'>{{ dataDetail.lastUpdatedDate }}</span>

    <label for='uri' class='title'>{{ 'resourceParameters.selfLink' | translate }}</label>
    <div id='uri' class='info-link background'>
        <div class="code">
            <code>{{ dataDetail.uri }}</code>
        </div>
        <div class="element-link-actions">
            <button type="button">
                <i class="fa-thin fa-arrow-up-right-from-square"></i>
            </button>
            <button>
                <i class="fa-thin fa-copy"></i>
            </button>
        </div>
    </div>

    <label for='urn' class='title'>{{ 'resourceParameters.urn' | translate }}</label>
    <div id='urn' class='info-link background'>
        <div class="code">
            <code>{{ dataDetail.urn }}</code>
        </div>
        <div class="element-link-actions">
            <button>
                <i class="fa-thin fa-copy"></i>
            </button>
        </div>
    </div>
</div>

<div class="subsection-tab detail-tab">
    <ul class="nav nav-tabs">
        <li class="nav-item" *ngFor="let link of navLinks">
            <a class="nav-link" [ngClass]="activeLink == link ? 'active' : ''" 
               routerLinkActive="active">{{link.label}}
            </a>
        </li>
    </ul>
</div>

<div class='container detail-table'>
    <div *ngIf='activeLink == navLinks[0]'>
        <div *ngIf='!dataChildrenLoaded'>
            <mat-progress-bar mode='indeterminate'></mat-progress-bar>
        </div>
        <div #searchResults class='search-results-table' [style.display]="dataChildrenLoaded ? 'block' : 'none'">
            <table-expandable-rows #tableExpandable [columns]='columns'  
                               [routerLinkDetail]='routerLinkDetail'
                               (clickEvent)='onLoadFamilyCodelistDetail($event)' >
            </table-expandable-rows>
        </div>
    </div>
    <div *ngIf='dataChildren === null'>
        <span>{{ 'resultsNotFound' | translate }}</span>
    </div>
</div>
