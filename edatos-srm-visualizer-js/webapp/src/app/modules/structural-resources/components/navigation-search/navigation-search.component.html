<div class="container">
  <div class="section-tab">
    <ul class="nav nav-pills">
      <li class="nav-item" *ngFor="let link of navLinks">
        <a class="nav-link" routerLink={{link.link}} (click)="activeLink = link.label" 
          routerLinkActive="active">{{link.label}}
        </a>
      </li>
    </ul>
  </div>
  <router-outlet></router-outlet>
</div>
