<div class="container-fluid mt-2">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="button" [class.active]="tab === StructuralResources.Codelists_Families"
                        (click)="loadFamiliesCodelist()" class="btn btn-navbar btn-light">Familia de
                        clasificaciones</button>
                    <button type="button" [class.active]="tab === StructuralResources.Codelists"
                        (click)="loadCodelist()" class="btn btn-navbar btn-light">Clasificaciones</button>
                    <button type="button" [class.active]="tab === StructuralResources.Codelists_Codes"
                        (click)="loadCodes()" class="btn btn-navbar btn-light">Códigos</button>
                </div>
            </div>
        </div>
    </nav>

    <div *ngIf="tab === StructuralResources.Codelists">
        <app-codelist></app-codelist>
    </div>
    <div *ngIf="tab === StructuralResources.Codelists_Families">
        <app-codelist-families></app-codelist-families>
    </div>
    <div *ngIf="tab === StructuralResources.Codelists_Codes">
        <app-codes></app-codes>
    </div>
</div>
