<div class="container-fluid mt-2">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand"></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarText"
                aria-controls="navbarText" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarText">
                <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                    <button type="button" [class.active]="tab === StructuralResources.Organizations_Scheme" (click)="loadOrganizationsScheme()" class="btn btn-light">Esquema de Organizaciones</button>
                    <button type="button" [class.active]="tab === StructuralResources.Organizations" (click)="loadOrganizations()" class="btn btn-light">Organizaciones</button>
                </div>
            </div>
        </div>
    </nav>
    <div *ngIf="tab === StructuralResources.Organizations">
        <app-organizations></app-organizations>
    </div>
    <div *ngIf="tab === StructuralResources.Organizations_Scheme">
        <app-organizations-scheme></app-organizations-scheme>
    </div>
</div>
