<div class="card mt-3">
    <div class="card-header text-center fw-bold">
        BUSCADOR
    </div>
    <div class="card-body">
        <form [formGroup]="searchForm">
            <div class="input-group input-group-sm mb-3">
                <span class="input-group-text" id="inputGroup-sizing-sm">ID</span>
                <input formControlName="id" id="id" class="form-control" aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-sm">
                <span class="input-group-text" id="inputGroup-sizing-sm">NOMBRE</span>
                <input formControlName="name" type="text" class="form-control" aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-sm">
            </div>
            <div class="input-group input-group-sm mb-3">
                <span class="input-group-text" id="inputGroup-sizing-sm">URN</span>
                <input formControlName="urn" type="text" class="form-control" aria-label="Sizing example input"
                    aria-describedby="inputGroup-sizing-sm">
            </div>
            <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                <button type="button" class="btn btn-labeled btn-info" (click)="onSearch()">
                    <span class="btn-label"><i class="fa fa-search"></i></span>Buscar</button>
                <button type="button" class="btn btn-labeled btn-info" (click)="onReset()">
                    <span class="btn-label"><i class="fa fa-eraser"></i></span>Limpiar</button>
            </div>
        </form>
    </div>
</div>


<div class="card mt-5">
    <table class="table table-sm table-hover text-start">
        <thead class="table-light">
            <tr>
                <th scope="col">Identificador</th>
                <th scope="col">Mantenedor</th>
                <th scope="col">Versión</th>
                <th scope="col">Nombre</th>
            </tr>
        </thead>
        <tbody>
           <tr *ngFor="let item of dataSearch" class="fw-light">
                <th scope="row">{{item.id}}</th>
                <td>{{item.urn | agency }}</td>
                <td>{{item.urn | version }}</td>
                <td>{{item.name.text[0].value}}</td>
            </tr>

        </tbody>
    </table>
</div>
