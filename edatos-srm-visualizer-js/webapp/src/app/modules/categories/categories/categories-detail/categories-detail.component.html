<div class='general-buttons row'>
    <div class='col'>
        <button (click)='onReturn()' class="text-icon-button">
            <i class="fa-thin fa-left"></i>&nbsp;
            <span>{{ 'back' | translate | uppercase }}</span>
        </button>
    </div>
</div>

<div [formGroup]='detailForm' class='detail-info'>
    <label for='id' class='title'>{{ 'category.parameters.idCategory' | translate }}</label>
    <span class="info-id">{{ dataDetail.id }}</span>

    <label for='name' class='title'>{{ 'resourceParameters.name' | translate }}</label>
    <span>{{ dataDetail.name }}</span>

    <label for='uri' class='title'>{{ 'resourceParameters.selfLink' | translate }}</label>
    <div class='info-link background'>
        <div class="code">
            <code>{{ dataDetail.uri }}</code>
        </div>
        <div class="element-link-actions">
            <button type="button">
                <i class="fa-thin fa-arrow-up-right-from-square"></i>
            </button>
            <button>
                <i class="fa-thin fa-copy"></i>
            </button>
        </div>
    </div>

    <label for='urn' class='title'>{{ 'resourceParameters.urn' | translate }}</label>
    <div class='info-link background'>
        <div class="code">
            <code>{{ dataDetail.urn }}</code>
        </div>
        <div class="element-link-actions">
            <button>
                <i class="fa-thin fa-copy"></i>
            </button>
        </div>
    </div>

    <div *ngIf="dataDetail.annotations">
        <label for='annotations' class='title'>{{ 'resourceParameters.comments' | translate }}</label>
        <span>{{ dataDetail.annotations }}</span>
    </div>

    <label for='categroyScheme' class='title'>{{ 'category.categorySchemes' | translate }}</label>
    <div class='info-link'>
        <span class="info-agency">{{ dataDetail.categoryScheme }}</span>
        <div class="element-link-actions">
            <button type="button">
                <i class="fa-thin fa-arrow-up-right-from-square"></i>
            </button>
        </div>
    </div>

    <label for='maintainer' class='title'>{{ 'codelists.parameters.agency' | translate }}</label>
    <div class='info-link'>
        <span class="info-agency" id='maintainer'>{{ dataDetail.maintainer }}</span>
        <div class="element-link-actions">
            <button type="button">
                <i class="fa-thin fa-arrow-up-right-from-square"></i>
            </button>
        </div>
    </div>
</div>

<div class="subsection-tab detail-tab">
    <ul class="nav nav-tabs">
        <li class="nav-item" *ngFor="let link of navLinks">
          <a class="nav-link" [ngClass]="activeLink.label == link.label ? 'active' : ''" (click)="onActiveItemChange(link)" 
            routerLinkActive="active">{{link.label}}
          </a>
        </li>
    </ul>
</div>

<div class='container detail-table'>
    <div *ngIf='!dataChildrenLoaded'>
        <mat-progress-bar mode='indeterminate'></mat-progress-bar>
    </div>
    <div *ngIf='activeLink == navLinks[0]'>
        <div class='search-results-table' [style.display]="dataChildrenLoaded ? 'block' : 'none'">
            <app-table-tree #tabletreenode [data]='dataChildren'></app-table-tree>
        </div>
    </div>
</div>
<br />
