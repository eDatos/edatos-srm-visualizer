<div [formGroup]='searchSimpleForm'>
    <div class="general-search row">
        <div *ngIf="!marked">
            <label for="filter" class="title">{{ 'resourceParameters.generalSearchEngine' | translate }}</label>
        </div>
        <div class="col" *ngIf="!marked">
            <input type="text" class="form-control" formControlName="filter" id="filter"
                   placeholder="{{ 'search' | translate | lowercase }}..." (keyup.enter)="onSearch()">
        </div>
        <div class='custom-control custom-switch col' *ngIf='marked'>
            <label for='allVersions'
                   [ngClass]="showAllVersions?'label-inputswitch-checked':''">{{ 'resourceParameters.showAllVersions' | translate }}</label>
            <p-inputSwitch id="allVersions" inputId='allVersions' (onChange)='onSearchWithAllVersions()'/>
        </div>
        <div class='custom-control custom-switch'>
            <label for='advancedSearch'
                   [ngClass]="marked?'label-inputswitch-checked':''">{{ 'resourceParameters.advancedSearch' | translate }}</label>
            <p-inputSwitch id="advancedSearch" inputId='advancedSearch' (onChange)='toggleVisibility($event)'></p-inputSwitch>
        </div>
    </div>
</div>

<div>
    <div *ngIf='!dataChildrenLoaded'>
        <mat-progress-bar mode='indeterminate'></mat-progress-bar>
    </div>
    <div #searchResults class='search-results-table' [scrollWindow]='false' infinite-scroll
             [fromRoot]='true'
             (scrolled)='onScrollDown($event)' >
            <table-expandable-rows #tableExpandable [columns]='selectedFields' [data]='dataChildren'
                                   [routerLinkDetail]='routerLinkDetail'
                                   (clickEvent)='onLoadCategoryDetail($event)'></table-expandable-rows>
    </div>
</div>
<br/>
