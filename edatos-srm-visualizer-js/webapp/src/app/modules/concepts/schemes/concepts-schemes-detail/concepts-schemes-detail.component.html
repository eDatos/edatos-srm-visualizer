<div class='general-buttons row'>
    <div class='col'>
        <button (click)='onReturn()' class='text-icon-button'>
            <i class='fa-thin fa-left'></i>&nbsp;
            <span>{{ 'back' | translate | uppercase }}</span>
        </button>
    </div>
    <div>
        <p-dropdown #select [options]='versions' [filter]='true' optionLabel='name' optionValue='value'
                    filterBy='value' placeholder="{{ 'otherVersions' | translate | uppercase }}"
                    class='p-dropdown-custom' dropdownIcon='fa-thin fa-chevron-down'
                    (onChange)='onLoadDetailVersion($event)'
                    (onShow)='handleOnPanelShow()' (onHide)='handleOnPanelHide()'
                    filterPlaceholder="{{ 'search' | translate | lowercase }}..." emptyFilterMessage=' '>
            <ng-template let-version pTemplate='item'>
                <div>
                    <div>v{{ version.value }}</div>
                </div>
            </ng-template>
        </p-dropdown>
    </div>
    <div>
        <p-menu [model]='items' #menu [popup]='true' class='p-menu-custom' (onShow)='handleVisibilityMenu()'
                (onHide)='handleVisibilityMenu()'></p-menu>
        <button (click)='menu.toggle($event)' [ngClass]="expandedMenu ? 'menu-text-icon-button' : 'text-icon-button'">
            <span>{{ 'download.title' | translate | uppercase }}</span>&nbsp;
            <i [ngClass]="expandedMenu ? 'fa-solid fa-chevron-up' : 'fa-thin fa-chevron-down'"></i>
        </button>
    </div>
</div>

<div [formGroup]='detailForm' class='detail-info'>
    <label for='id' class='title'>{{ 'codelists.parameters.id' | translate }}</label>
    <span class='info-id' id='id'>{{ dataDetail.id }}</span>

    <label for='name' class='title'>{{ 'resourceParameters.name' | translate }}</label>
    <span id='name'>{{ dataDetail.name }}</span>

    <label for='version' class='title'>{{ 'resourceParameters.version' | translate }}</label>
    <span id='version'>{{ dataDetail.version }}</span>

    <label for='description' class='title'>{{ 'resourceParameters.description' | translate }}</label>
    <div id='description' [innerHTML]='parseDesriptionToHtml()'></div>

    <label for='uri' class='title'>{{ 'resourceParameters.selfLink' | translate }}</label>
    <div id='uri' class='info-link background'>
        <div class='code'>
            <code>{{ dataDetail.uri }}</code>
        </div>
        <div class='element-link-actions'>
            <button type='button'>
                <i class='fa-thin fa-arrow-up-right-from-square'></i>
            </button>
            <button>
                <i class='fa-thin fa-copy'></i>
            </button>
        </div>
    </div>

    <label for='urn' class='title'>{{ 'resourceParameters.urn' | translate }}</label>
    <div id='urn' class='info-link background'>
        <div class='code'>
            <code>{{ dataDetail.urn }}</code>
        </div>
        <div class='element-link-actions'>
            <button>
                <i class='fa-thin fa-copy'></i>
            </button>
        </div>
    </div>

    <div *ngIf='dataDetail.annotations'>
        <label for='annotations' class='title'>{{ 'resourceParameters.comments' | translate }}</label>
        <span id='annotations'>{{ dataDetail.annotations }}</span>
    </div>

    <label for='maintainer' class='title'>{{ 'codelists.parameters.agency' | translate }}</label>
    <div class='info-link'>
        <span class='info-agency' id='maintainer'>{{ dataDetail.maintainer }}</span>
        <div class='element-link-actions'>
            <button type='button'>
                <i class='fa-thin fa-arrow-up-right-from-square'></i>
            </button>
        </div>
    </div>

</div>
<br>
<div class="subsection-tab detail-tab">
    <ul class="nav nav-tabs">
        <li class="nav-item" *ngFor="let link of navLinks">
            <a class="nav-link" [ngClass]="activeLink == link.label ? 'active' : ''" (click)="activeLink = link.label;"
               routerLinkActive="active">{{link.label}}
            </a>
        </li>
    </ul>
</div>

<br/>
<div class='container detail-table'>
    <div *ngIf='!dataChildrenLoaded'>
        <mat-progress-bar mode='indeterminate'></mat-progress-bar>
    </div>
    <div *ngIf='activeLink == navLinks[0].label' >
        <table-expandable-rows #tableExpandable [columns]='columns' [data]='conceptsOfScheme'
                               [routerLinkDetail]='routerLinkDetail'
                               (clickEvent)='onLoadConceptsDetail($event)'>
        </table-expandable-rows>
    </div>
    <div *ngIf='dataChildren === null'>
        <span>{{ 'resultsNotFound' | translate }}</span>
    </div>
</div>
<br />
<br />
