<div class='m-30'>
    <div class='general-buttons'>
        <div class='general-left-buttons row'>
            <button (click)='onReturn()'>
                <span>{{ 'back' | translate }}</span>
            </button>
        </div>
        <div class='general-right-buttons row'>
            <p-dropdown [options]='versions' [(ngModel)]='selectedVersion' optionLabel='name' [filter]='true'
                        filterBy='value' [showClear]='true' placeholder="{{ 'otherVersions' | translate | uppercase }}"
                        class='p-dropdown-custom' dropdownIcon='fa-thin fa-chevron-down'>
                <ng-template pTemplate='selectedItem'>
                    <div class='flex align-items-center gap-2' *ngIf='selectedVersion'>
                        <div>{{ selectedVersion }}</div>
                    </div>
                </ng-template>
                <ng-template let-version pTemplate='item'>
                    <div class='flex align-items-center gap-2'>
                        <button (click)='onLoadDetailVersion(version.value)'>v{{ version.value }}</button>
                    </div>
                </ng-template>
            </p-dropdown>
            <button color='primary' (click)='onDownloadSdmx()'>
                <span>{{ 'download.sdmx-xml' | translate }}</span>
            </button>
        </div>
    </div>

    <div [formGroup]='detailForm' class='container'>
        <label for='id' class='title'>{{ 'codelists.parameters.id' | translate }}</label>
        <input type='text' class='form-control' formControlName='id' id='id' readonly>

        <label for='name' class='title'>{{ 'resourceParameters.name' | translate }}</label>
        <input type='text' class='form-control' formControlName='name' id='name' readonly>

        <label for='version' class='title'>{{ 'resourceParameters.version' | translate }}</label>
        <input type='text' class='form-control' formControlName='version' id='version' readonly>

        <label for='description' class='title'>{{ 'resourceParameters.description' | translate }}</label>
        <div id='description' [innerHTML]='parseDesriptionToHtml()'></div>

        <label for='uri' class='title'>{{ 'resourceParameters.selfLink' | translate }}</label>
        <input type='text' class='form-control' formControlName='uri' id='uri' readonly>

        <label for='urn' class='title'>{{ 'resourceParameters.urn' | translate }}</label>
        <input type='text' class='form-control' formControlName='urn' id='urn' readonly>

        <label for='annotations' class='title'>{{ 'resourceParameters.comments' | translate }}</label>
        <input type='text' class='form-control' formControlName='annotations' id='annotations' readonly>

        <label for='agency' class='title'>{{ 'codelists.parameters.agency' | translate }}</label>
        <input type='text' class='form-control' formControlName='agency' id='agency' readonly>

    </div>
    <br>
    <div class='container'>
        <div class='section-tab'>
            <p-tabMenu [model]='navLinks'></p-tabMenu>
        </div>
        <div class='m-30'>
            <div class='m-30' *ngIf='!dataChildrenLoaded'>
                <mat-progress-bar mode='indeterminate'></mat-progress-bar>
            </div>
            <div class='search-results' [style.display]="dataChildrenLoaded ? 'block' : 'none'">
                <p-table [value]='conceptsOfScheme' class='search-results'>
                    <ng-template pTemplate='header'>
                        <tr>
                            <th>{{ 'resourceParameters.identifier' | translate }}</th>
                            <th>{{ 'resourceParameters.name' | translate }}</th>
                            <th>{{ 'resourceParameters.description' | translate }}</th>
                        </tr>
                    </ng-template>
                    <ng-template pTemplate='body' let-code>
                        <tr>
                            <td>{{ code.id }}</td>
                            <td>{{ code.name }}</td>
                            <td>{{ code.description }}</td>
                        </tr>
                    </ng-template>
                </p-table>
            </div>
        </div>
    </div>
    <br />
</div>
