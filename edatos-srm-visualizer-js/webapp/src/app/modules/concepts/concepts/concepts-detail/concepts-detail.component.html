<div class='general-buttons row'>
    <div class='row-large'>
        <button (click)='onReturn()' class='text-icon-button'>
            <i class='fa-thin fa-left'></i>&nbsp;
            <span>{{ 'back' | translate | uppercase }}</span>
        </button>
    </div>
</div>

<div [formGroup]='detailForm' class='detail-info'>
    <label for='id' class='title'>{{ 'concepts.parameters.idConcept' | translate }}</label>
    <span id='id' class='info-id'>{{ dataDetail.id }}</span>

    <label for='name' class='title'>{{ 'resourceParameters.name' | translate }}</label>
    <span id='name' class='info-description'>{{ dataDetail.name }}</span>

    <label for='description' class='title'>{{ 'resourceParameters.description' | translate }}</label>
    <span id='description' class='info-description' [innerHTML]='parseDescriptionToHtml()'></span>

    <label for='uri' class='title'>{{ 'resourceParameters.selfLink' | translate }}</label>
    <div id='uri' class='info-link background'>
        <div class='code'>
            <code>{{ dataDetail.uri }}</code>
        </div>
        <div class='element-link-actions'>
            <button type='button' (click)="openSelfLink(dataDetail.uri)">
                <i class='fa-thin fa-arrow-up-right-from-square'></i>
            </button>
            <button copyClipboard="{{dataDetail.uri}}" (click)="onCopyUriSuccess()">
                <i class='fa-thin fa-copy'></i>
            </button>
        </div>
        <div class="copied-message" *ngIf="copiedUri">{{ 'copy' | translate }}</div>
    </div>

    <label for='urn' class='title'>{{ 'resourceParameters.urn' | translate }}</label>
    <div id='urn' class='info-link background'>
        <div class='code'>
            <code>{{ dataDetail.urn }}</code>
        </div>
        <div class='element-link-actions'>
            <button copyClipboard="{{dataDetail.urn}}" (click)="onCopyUrnSuccess()">
                <i class='fa-thin fa-copy'></i>
            </button>
        </div>
        <div class="copied-message" *ngIf="copiedUrn">{{ 'copy' | translate }}</div>
    </div>

    <div *ngIf='dataDetail.annotations'>
        <span class='title'>{{ 'resourceParameters.comments' | translate }}</span>
        <div class="annotations">
            <span *ngFor="let annotation of dataDetail.annotations">{{ annotation }}</span>
        </div>
    </div>

    <label for='conceptScheme' class='title'>{{ 'concepts.conceptSchemes' | translate }}</label>
    <div class='info-link'>
        <button type='button' (click)="openConceptSchemeLink(dataDetail.urn)">
            <span class='info-agency' id='conceptScheme'>{{ dataDetail.conceptScheme?.id }}
                (v{{ dataDetail.conceptScheme?.version }})</span>&nbsp;
            <i class='fa-thin fa-arrow-up-right-from-square'></i>
        </button>
    </div>

    <label for='maintainer' class='title'>{{ 'resourceParameters.agency' | translate }}</label>
    <div class='info-link'>
        <button type='button' (click)="openMaintainerLink(dataDetail.agency)">
            <span class='info-agency'>{{ dataDetail.maintainer }}</span>&nbsp;
            <i class='fa-thin fa-arrow-up-right-from-square'></i>
        </button>
    </div>
</div>

<div class="subsection-tab detail-tab">
    <ul class="nav nav-tabs">
        <li class="nav-item" *ngFor="let link of navLinks; let i = index"
            [ngClass]="{'active': activeLink === link, 'disabled': isTabDisabled(i)}"
            [attr.title]="isTabDisabled(i) ? ('resourceParameters.tabDisabledNoData' | translate) : null">
            <a class="nav-link" [ngClass]="{'active': activeLink === link}"
               (click)="isTabDisabled(i) ? null : onActiveItemChange(link)">
                {{ link.label }}
            </a>
        </li>
    </ul>
</div>

<div class='detail-table'>
    <div *ngIf='activeLink == navLinks[0]'>
        <div #searchResults class='search-results-table-detail' [scrollWindow]='false' infinite-scroll
             [fromRoot]='true'>
            <table-expandable-rows #tableExpandable [columns]='codelistColumns' [data]='recommendedCodelists'
                                   (clickEvent)='onLoadCodelistDetail($event)' [routerLinkDetail]="routerLinkDetail">
            </table-expandable-rows>
        </div>
        <app-paginations
                [currentPage]="searchConfig.currentPage"
                [totalItems]="searchConfig.resultSize"
                [pageSize]="searchConfig.resultLimit"
                (changePage)="onChangePage($event)">
        </app-paginations>
    </div>
    <div *ngIf='activeLink == navLinks[1]'>
        <div #searchResults class='search-results-table-detail' [scrollWindow]='false' infinite-scroll
             [fromRoot]='true'>
            <table-expandable-rows #tableExpandable [columns]='conceptColumns' [data]='otherConcepts'
                                   (clickEvent)='onLoadConceptsDetail($event)' [routerLinkDetail]="routerLinkDetail">
            </table-expandable-rows>
        </div>
        <app-paginations
                [currentPage]="searchConfig.currentPage"
                [totalItems]="searchConfig.resultSize"
                [pageSize]="searchConfig.resultLimit"
                (changePage)="onChangePage($event)">
        </app-paginations>
    </div>
</div>
